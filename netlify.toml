[build]
  # Puppeteer's prerender step needs a matching Chrome binary, and
  # Netlify's build image doesn't ship one. Install it before the
  # build so `node scripts/prerender.mjs` can launch a browser.
  command = "npx puppeteer browsers install chrome && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# SPA fallback — React Router handles all routes client-side, so any URL
# that doesn't match a real file in /dist (e.g. /sitemap.xml, /robots.txt,
# /assets/*, /favicon.ico) should serve index.html and let the router
# take over. Without this, deep links return 404 to direct visitors and
# search engine crawlers.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
